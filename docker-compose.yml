services:
  proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
      - backend
    user: "101:101"
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100

  api:
    build: .
    restart: unless-stopped
    environment:
      POSTGRES_USER: bancandino_app
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_HOST: db
      POSTGRES_DB: bancandino_prod
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      BANK_OPERATOR_USERNAME: ${BANK_OPERATOR_USERNAME:-cashier}
      BANK_OPERATOR_PASSWORD_FILE: /run/secrets/bank_operator_password
    secrets:
      - db_password
      - jwt_secret
      - bank_operator_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_DB: bancandino_prod
    secrets:
      - postgres_admin_password
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts_utiles/create_app_role.sh:/docker-entrypoint-initdb.d/10-create-app-role.sh:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
    pids_limit: 200

volumes:
  pgdata:

networks:
  frontend:
  backend:
    internal: true

secrets:
  postgres_admin_password:
    file: ./secrets/postgres_admin_password.txt
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  bank_operator_password:
    file: ./secrets/bank_operator_password.txt
